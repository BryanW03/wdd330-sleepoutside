<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/cart.js" type="module"></script>
  </head>
  <body>
    <header>
      <div class="header__brand">
        <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" class="header__logo-img" />
        <a href="/index.html" class="header__logo-text">Sleep<span class="highlight">Outside</span></a>
      </div>
      <nav class="header__nav header__nav--right">
        <a href="/cart/index.html" class="header__cart-link">
          <div class="cart">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
            <span class="cart-badge"></span>
          </div>
          <span class="header__cart-text">Cart</span>
        </a>
      </nav>
    </header>

    <main class="cart-page">
      <div class="cart-page__inner">
        <h1 class="cart-page__title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="cart-page__title-icon">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
          My Cart
        </h1>
        <div class="cart-page__body">
          <div class="cart-page__items">
            <ul class="product-list"></ul>
          </div>
          <aside class="cart-summary">
            <h2 class="cart-summary__title">Order Summary</h2>
            <div class="cart-total"></div>
            <a href="/checkout/index.html" class="btn btn--primary cart-summary__checkout">Checkout →</a>
            <a href="/index.html" class="btn btn--secondary cart-summary__continue">← Continue Shopping</a>
          </aside>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer__wave">
        <svg viewBox="0 0 1440 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,30 C360,60 1080,0 1440,30 L1440,60 L0,60 Z" fill="#2c1f0e"/>
        </svg>
      </div>
      <div class="footer__inner">
        <div class="footer__bottom">
          <p>&copy; 2025 ⛺ SleepOutside &nbsp;·&nbsp; WDD 330 &nbsp;·&nbsp; BYU-Idaho for BYU-Pathway Worldwide Online</p>
          <p class="footer__legal">Not a real business. Educational purposes only.</p>
        </div>
      </div>
    </footer>
  </body>
</html>

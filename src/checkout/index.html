<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/checkout.js" type="module"></script>
  </head>
  <body>
    <header>
      <div class="header__brand">
        <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" class="header__logo-img" />
        <a href="/index.html" class="header__logo-text">Sleep<span class="highlight">Outside</span></a>
      </div>
      <nav class="header__nav header__nav--right">
        <a href="/cart/index.html" class="header__cart-link">
          <div class="cart">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
            <span class="cart-badge"></span>
          </div>
          <span class="header__cart-text">Cart</span>
        </a>
      </nav>
    </header>

    <main class="checkout-page">
      <div class="checkout-page__inner">
        <h1 class="cart-page__title">Checkout</h1>

        <div class="checkout-layout">
          <!-- Formulario -->
          <section class="checkout-form-section">
            <h2 class="checkout-section__title">Shipping Information</h2>
            <div id="checkout-form">
              <div class="form-row">
                <div class="form-group">
                  <label for="firstName">First Name *</label>
                  <input type="text" id="firstName" name="firstName" class="form-input" required />
                </div>
                <div class="form-group">
                  <label for="lastName">Last Name *</label>
                  <input type="text" id="lastName" name="lastName" class="form-input" required />
                </div>
              </div>
              <div class="form-group">
                <label for="street">Street Address *</label>
                <input type="text" id="street" name="street" class="form-input" required />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="city">City *</label>
                  <input type="text" id="city" name="city" class="form-input" required />
                </div>
                <div class="form-group">
                  <label for="state">State *</label>
                  <input type="text" id="state" name="state" class="form-input" maxlength="2" required />
                </div>
                <div class="form-group">
                  <label for="zip">ZIP Code *</label>
                  <input type="text" id="zip" name="zip" class="form-input" required />
                </div>
              </div>

              <h2 class="checkout-section__title" style="margin-top:2rem;">Payment Information</h2>
              <div class="form-group">
                <label for="cardNumber">Card Number *</label>
                <input type="text" id="cardNumber" name="cardNumber" class="form-input" placeholder="1234 5678 9012 3456" maxlength="19" required />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="expiry">Expiry (MM/YY) *</label>
                  <input type="text" id="expiry" name="expiry" class="form-input" placeholder="MM/YY" maxlength="5" required />
                </div>
                <div class="form-group">
                  <label for="cvv">CVV *</label>
                  <input type="text" id="cvv" name="cvv" class="form-input" maxlength="4" required />
                </div>
              </div>

              <button id="place-order-btn" class="btn btn--primary checkout-submit">Place Order →</button>
            </div>

            <!-- Confirmación -->
            <div id="order-confirmation" class="order-confirmation" style="display:none;">
              <div class="order-confirmation__icon">✅</div>
              <h2>Order Placed!</h2>
              <p>Thank you for your order. You will receive a confirmation email shortly.</p>
              <a href="/index.html" class="btn btn--primary" style="margin-top:1.5rem;">Continue Shopping</a>
            </div>
          </section>

          <!-- Resumen -->
          <aside class="checkout-summary">
            <h2 class="cart-summary__title">Order Summary</h2>
            <ul class="checkout-items" id="checkout-items"></ul>
            <div class="cart-total" id="checkout-total"></div>
          </aside>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer__wave">
        <svg viewBox="0 0 1440 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,30 C360,60 1080,0 1440,30 L1440,60 L0,60 Z" fill="#2c1f0e"/>
        </svg>
      </div>
      <div class="footer__inner">
        <div class="footer__bottom">
          <p>&copy; 2025 ⛺ SleepOutside</p>
        </div>
      </div>
    </footer>
  </body>
</html>

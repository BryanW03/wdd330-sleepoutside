<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="divider">
      <div class="logo">
        <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
        <a href="/index.html"> Sleep<span class="highlight">Outside</span></a>
      </div>
      <div class="cart">
        <a href="/cart/index.html">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <path d="M18.9 32.6c1.1 2.4 2.5 3.3 5.4 3.3 1.6 0 3.6-0.3 5.9-0.6 3.2-0.5 6.9-1 11.2-1 2.1 0 4.3 0.1 6.4 0.3 2.1 0.1 4.2 0.3 6.1 0.3 3.2 0 5.8-0.9 7.7-2.6 1.9-1.7 2.9-4.2 2.9-7.4 0-2.6-0.7-5-2-7.3l-3.3-5.7c-1.3-2.2-3.1-3.9-5.4-4.9-2.3-1-4.9-1.4-7.7-1.4-2.4 0-4.8 0.3-7.1 0.8-2.3 0.5-4.5 1.3-6.4 2.4-1.2 0.7-2.3 1.5-3.3 2.4l-1.9 1.9c-0.6 0.6-1.1 1.2-1.5 1.9l-3.3 5.7c-0.4 0.7-0.7 1.5-0.9 2.3l-0.3 1.2c-0.1 0.5-0.1 0.9-0.1 1.4 0 1.9 0.6 3.4 1.8 4.6z"/>
          </svg>
        </a>
      </div>
    </header>

    <main>
      <section class="hero divider">
        <img
          src="/images/mountain-lake_640.jpg"
          srcset="/images/mountain-lake_640.jpg 640w, /images/mountain-lake_1280.jpg 1280w"
          sizes="(max-width: 640px) 640px, 1280px"
          alt="image of a high mountain lake"
        />
        <div class="mission">
          <p>Our mission is to provide you with everything you need to sleep outside comfortably at an affordable price.</p>
        </div>
      </section>

      <nav class="category-nav-wrap divider">
        <ul class="category-nav">
          <li><a href="?category=tents">🏕️ Tents</a></li>
          <li><a href="?category=backpacks">🎒 Backpacks</a></li>
          <li><a href="?category=sleeping-bags">🛌 Sleeping Bags</a></li>
        </ul>
      </nav>

      <section class="products">
        <div class="products__toolbar">
          <h2 id="category-title">Top Products</h2>
          <div class="products__controls">
            <input
              type="search"
              id="product-search"
              class="product-search"
              placeholder="Search products…"
              aria-label="Search products"
            />
            <select id="product-sort" class="product-sort" aria-label="Sort products">
              <option value="default">Sort: Default</option>
              <option value="price-asc">Price: Low → High</option>
              <option value="price-desc">Price: High → Low</option>
              <option value="name-asc">Name: A → Z</option>
              <option value="name-desc">Name: Z → A</option>
              <option value="discount">Best Discount</option>
            </select>
          </div>
        </div>
        <ul class="product-list"></ul>
      </section>
    </main>

    <footer>&copy;2025 ⛺ SleepOutside ⛺ WDD 330 ⛺ BYU-Idaho for BYU-Pathway Worldwide Online</footer>

    <script type="module">
      import ProductData from '/js/ProductData.mjs';
      import ProductList from '/js/ProductList.js';
      import { updateCartBadge, showAlert } from '/js/utils.mjs';

      const params = new URLSearchParams(window.location.search);
      const cat = params.get('category') || 'tents';

      const titles = {
        tents: 'Tents',
        backpacks: 'Backpacks',
        'sleeping-bags': 'Sleeping Bags'
      };

      const titleEl = document.getElementById('category-title');
      if (titleEl) {
        titleEl.textContent = `Top Products: ${titles[cat] || cat}`;
      }

      const dataSource = new ProductData(cat);
      const listElement = document.querySelector('.product-list');

      if (listElement) {
        const productList = new ProductList(cat, dataSource, listElement);
        productList.init();
      }

      updateCartBadge();

      const PROMO_MESSAGE = '🏕️ Summer sale — up to 35% off select tents!';
      const PROMO_TYPE = 'info';
      const PROMO_DURATION = 0;

      if (!sessionStorage.getItem('promo-shown')) {
        showAlert(PROMO_MESSAGE, PROMO_TYPE, PROMO_DURATION);
        sessionStorage.setItem('promo-shown', '1');
      }
    </script>
  </body>
</html>

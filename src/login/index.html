<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <div class="header__brand">
        <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" class="header__logo-img" />
        <a href="/index.html" class="header__logo-text">Sleep<span class="highlight">Outside</span></a>
      </div>
      <nav class="header__nav header__nav--right">
        <a href="/cart/index.html" class="header__cart-link">
          <div class="cart">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
            <span class="cart-badge"></span>
          </div>
          <span class="header__cart-text">Cart</span>
        </a>
      </nav>
    </header>

    <main class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <img src="/images/noun_Tent_2517.svg" alt="logo" />
          <span>Sleep<span class="highlight">Outside</span></span>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login">Sign In</button>
          <button class="auth-tab" id="tab-register">Sign Up</button>
        </div>

        <div id="auth-msg" class="auth-msg" style="display:none;"></div>

        <!-- LOGIN FORM -->
        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" class="form-input" placeholder="your@email.com" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-password-wrap">
              <input type="password" id="login-password" class="form-input" placeholder="••••••••" required />
              <button type="button" class="toggle-password" data-target="login-password">👁</button>
            </div>
          </div>
          <button type="submit" class="btn btn--primary auth-submit" id="login-btn">Sign In</button>
          <p class="auth-switch">
            Don't have an account?
            <button type="button" class="auth-link" id="go-register">Sign Up</button>
          </p>
        </form>

        <!-- REGISTER FORM -->
        <form id="register-form" class="auth-form" style="display:none;">
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" class="form-input" placeholder="John Doe" required />
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" class="form-input" placeholder="your@email.com" required />
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <div class="input-password-wrap">
              <input type="password" id="reg-password" class="form-input" placeholder="Min. 6 characters" required minlength="6" />
              <button type="button" class="toggle-password" data-target="reg-password">👁</button>
            </div>
          </div>
          <div class="form-group">
            <label for="reg-confirm">Confirm Password</label>
            <input type="password" id="reg-confirm" class="form-input" placeholder="Repeat password" required />
          </div>
          <button type="submit" class="btn btn--primary auth-submit" id="register-btn">Create Account</button>
          <p class="auth-switch">
            Already have an account?
            <button type="button" class="auth-link" id="go-login">Sign In</button>
          </p>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer__inner">
        <div class="footer__bottom" style="padding: 1.25rem 0;">
          <p>&copy; 2025 ⛺ SleepOutside</p>
        </div>
      </div>
    </footer>

    <script type="module">
      import Auth from '/js/Auth.mjs';
      import { updateCartBadge } from '/js/utils.mjs';

      updateCartBadge();

      if (Auth.isLoggedIn()) {
        window.location.href = '/index.html';
      }

      const tabLogin     = document.getElementById('tab-login');
      const tabRegister  = document.getElementById('tab-register');
      const loginForm    = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const msg          = document.getElementById('auth-msg');

      function showMsg(text, type = 'error') {
        msg.textContent = text;
        msg.className = `auth-msg auth-msg--${type}`;
        msg.style.display = 'block';
      }
      function clearMsg() { msg.style.display = 'none'; }

      function switchToLogin() {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        loginForm.style.display = 'flex';
        registerForm.style.display = 'none';
        clearMsg();
      }
      function switchToRegister() {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        registerForm.style.display = 'flex';
        loginForm.style.display = 'none';
        clearMsg();
      }

      tabLogin.addEventListener('click', switchToLogin);
      tabRegister.addEventListener('click', switchToRegister);
      document.getElementById('go-register').addEventListener('click', switchToRegister);
      document.getElementById('go-login').addEventListener('click', switchToLogin);

      // Toggle password visibility
      document.querySelectorAll('.toggle-password').forEach(btn => {
        btn.addEventListener('click', () => {
          const input = document.getElementById(btn.dataset.target);
          input.type = input.type === 'password' ? 'text' : 'password';
        });
      });

      // LOGIN
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMsg();
        const btn = document.getElementById('login-btn');
        btn.textContent = 'Signing in…';
        btn.disabled = true;
        try {
          const email    = document.getElementById('login-email').value.trim();
          const password = document.getElementById('login-password').value;
          await Auth.login(email, password);
          showMsg('✅ Signed in! Redirecting…', 'success');
          setTimeout(() => { window.location.href = '/index.html'; }, 1000);
        } catch (err) {
          showMsg(err.message || 'Login failed. Check your credentials.');
          btn.textContent = 'Sign In';
          btn.disabled = false;
        }
      });

      // REGISTER
      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMsg();
        const password = document.getElementById('reg-password').value;
        const confirm  = document.getElementById('reg-confirm').value;
        if (password !== confirm) {
          showMsg('Passwords do not match.');
          return;
        }
        const btn = document.getElementById('register-btn');
        btn.textContent = 'Creating account…';
        btn.disabled = true;
        try {
          const name  = document.getElementById('reg-name').value.trim();
          const email = document.getElementById('reg-email').value.trim();
          await Auth.register(name, email, password);
          showMsg('🎉 Account created! Redirecting…', 'success');
          setTimeout(() => { window.location.href = '/index.html'; }, 1000);
        } catch (err) {
          showMsg(err.message || 'Registration failed. Try a different email.');
          btn.textContent = 'Create Account';
          btn.disabled = false;
        }
      });

      // Check URL tab param
      if (new URLSearchParams(window.location.search).get('tab') === 'register') {
        switchToRegister();
      }
    </script>
  </body>
</html>
